name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------------------
  # Linux (native)
  # ----------------------------------------------------------------
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc make cmake \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libsdl2-mixer-dev \
            libluajit-5.1-dev libgl1-mesa-dev

      - name: Build (Makefile)
        run: make -j$(nproc)

      - name: Build (CMake)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ashlands-linux
          path: ashlands

  # ----------------------------------------------------------------
  # Windows (cross-compile via MinGW)
  # ----------------------------------------------------------------
  windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW + SDL2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 cmake \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libsdl2-mixer-dev \
            libluajit-5.1-dev

      - name: Build (CMake cross)
        run: |
          cmake -B build-win \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release || echo "Cross-compile requires toolchain file; skipping."

  # ----------------------------------------------------------------
  # macOS
  # ----------------------------------------------------------------
  macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Homebrew)
        run: |
          brew install sdl2 sdl2_ttf sdl2_image sdl2_mixer luajit

      - name: Build (CMake)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang
          cmake --build build --parallel

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ashlands-macos
          path: build/ashlands

  # ----------------------------------------------------------------
  # Web (Emscripten) — optional, only on tagged releases
  # ----------------------------------------------------------------
  web:
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v13

      - name: Build WASM
        run: make web

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: ashlands-web
          path: build/web
