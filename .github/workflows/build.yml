name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*", "release-*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------------------
  # Linux (native)
  # ----------------------------------------------------------------
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc make cmake \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libsdl2-mixer-dev \
            libluajit-5.1-dev libgl1-mesa-dev

      - name: Build (Makefile)
        run: make -j$(nproc)

      - name: Build (CMake)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ashlands-linux
          path: ashlands

  # ----------------------------------------------------------------
  # Windows (cross-compile via MinGW)
  # ----------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-SDL2_mixer
            mingw-w64-ucrt-x86_64-luajit

      - name: Configure (CMake)
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (CMake)
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ashlands-windows
          path: build/ashlands.exe

  # ----------------------------------------------------------------
  # macOS
  # ----------------------------------------------------------------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Homebrew)
        run: |
          brew install sdl2 sdl2_ttf sdl2_image sdl2_mixer luajit

      - name: Build (CMake)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang
          cmake --build build --parallel

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ashlands-macos
          path: build/ashlands

  # ----------------------------------------------------------------
  # Web (Emscripten) — optional, only on tagged releases
  # ----------------------------------------------------------------
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v13

      - name: Install native deps for local tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libluajit-5.1-dev

      - name: Build WASM
        run: make web

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: ashlands-web
          path: build/web

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup NDK
        run: sdkmanager "ndk;25.2.9519653"

      - name: Download SDL2 source
        run: |
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.10/SDL2-2.30.10.tar.gz
          tar xf SDL2-2.30.10.tar.gz
          ln -sf $(pwd)/SDL2-2.30.10 android/app/src/main/jni/SDL2

      - name: Link source code and assets
        run: |
          mkdir -p android/app/src/main/assets
          ln -sf $(pwd)/src android/app/src/main/jni/src
          ln -sf $(pwd)/include android/app/src/main/jni/include
          mkdir -p android/app/src/main/java/org/libsdl
          rm -rf android/app/src/main/java/org/libsdl/app
          ln -sf $(pwd)/SDL2-2.30.10/android-project/app/src/main/java/org/libsdl/app android/app/src/main/java/org/libsdl/app
          rm -rf android/app/src/main/assets/assets android/app/src/main/assets/mods
          cp -r assets android/app/src/main/assets/
          cp -r mods android/app/src/main/assets/

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.4

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ashlands-android
          path: android/app/build/outputs/apk/release/*.apk
